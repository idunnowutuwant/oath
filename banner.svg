<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="auto">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#141418" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#040405" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <style>
    .wordmark { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
    .sub { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Frame Surface -->
  <rect width="1000" height="260" rx="12" fill="url(#bg)"/>
  <rect width="998" height="258" x="1" y="1" rx="11" fill="none" stroke="#18181e" stroke-width="1"/>

  <!-- Centered Bold Monolith Wordmark -->
  <text x="500" y="142" class="wordmark" font-size="94" fill="#ffffff" letter-spacing="-0.045em" text-anchor="middle">OATH</text>

  <!-- Timeless Enterprise Subline -->
  <text x="500" y="180" class="sub" font-size="11" font-weight="600" fill="#52525b" letter-spacing="0.32em" text-anchor="middle">CERTIFYING SYSTEMS</text>
</svg>
